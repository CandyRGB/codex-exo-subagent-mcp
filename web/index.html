<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>子代理会话 · codex-exo-subagent</title>
  <link rel="icon" href="/favicon.svg?v=exo-1" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/settings.css"><script src="/app.js" type="module"></script>
</head>
<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.3 4.3"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 9 9-3 1-2 5-3-3-6 6m6-6-4-4 5-2 1-3Z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 4 3-4 3m7 0h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 .1 8M20 3v6h-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9.5 6.3A12 12 0 0 1 12 6c6.5 0 10 6 10 6a15.2 15.2 0 0 1-3 3.5M6.4 7.6A16.4 16.4 0 0 0 2 12s3.5 6 10 6a11.6 11.6 0 0 0 4.4-.9"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3-1-1 4 2 2-1 3 3 3 3-1 2 3 4-1 1-3 3-1-1-4-3-1-1-3Z"/></symbol></defs></svg>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="会话导航">
    <div class="brand"><span class="brand-mark"><img src="/favicon.svg?v=exo-1" width="35" height="35" alt=""></span><span>codex-exo-subagent</span></div>
    <div class="search-box"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索会话" aria-label="搜索会话" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd></div>
    <div class="scope-nav"><button id="all-filter" class="scope-button selected"><span>全部会话</span><span class="count" id="total-count">—</span></button><button id="running-filter" class="scope-button"><span>正在进行</span><span class="count" id="running-count">0</span></button></div>
    <div class="sidebar-scroll" id="navigation"><div class="sidebar-loading">正在同步会话…</div></div>
    <button id="models-nav" class="settings-nav"><svg><use href="#i-settings"/></svg><span>模型与连接</span></button>
    <div class="sidebar-footer"><button id="theme-toggle" class="icon-button" title="切换明暗外观" aria-label="切换明暗外观"><svg><use href="#i-sun"/></svg></button><button id="refresh-button" class="icon-button" title="刷新会话" aria-label="刷新会话"><svg><use href="#i-refresh"/></svg></button></div>
  </aside>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="关闭侧栏"></button>
  <main class="main">
    <header class="topbar"><button id="sidebar-toggle" class="icon-button" title="切换侧栏" aria-label="切换侧栏"><svg><use href="#i-panel"/></svg></button><div class="breadcrumb"><span id="project-label">子代理会话</span><span class="breadcrumb-divider">/</span><span id="breadcrumb-title">会话记录</span></div><button id="new-connection" type="button" class="settings-add-button topbar-add-connection" hidden>＋ 添加连接</button><div class="top-actions" id="top-actions" hidden><button id="pin-button" class="icon-button" title="置顶会话" aria-label="置顶会话"><svg><use href="#i-pin"/></svg></button><a id="export-button" class="icon-button" title="导出会话" aria-label="导出会话"><svg><use href="#i-download"/></svg></a><button id="info-button" class="icon-button" title="会话信息" aria-label="会话信息"><svg><use href="#i-info"/></svg></button><button id="rename-button" class="icon-button" title="重命名会话" aria-label="重命名会话"><svg><use href="#i-edit"/></svg></button></div></header>
    <div id="error-banner" class="error-banner" role="status" hidden></div>
    <section id="settings-page" class="settings-page" aria-label="模型与连接" hidden><div class="settings-content">

      <div id="settings-load-error" class="settings-load-error" role="status" hidden></div>
      <div id="connections-list" class="connections-list"></div>
      <div id="connection-editor-home" hidden><section id="connection-editor" class="connection-editor" hidden>
      <form id="connection-form">
        <div id="connection-kind-field" class="settings-field"><label for="connection-kind">接入方式</label><select id="connection-kind"><option value="api" selected>模型 API 连接</option><option value="profile">已有 Codex profile</option></select></div>
        <div class="connection-primary-grid">
          <div class="settings-field"><label for="connection-name">连接名称</label><input id="connection-name" maxlength="80" required placeholder="例如：我的本地 Qwen / 公司模型路由"></div>
          <div id="profile-fields" class="settings-field" hidden><label for="connection-profile">profile 名称</label><input id="connection-profile" pattern="[A-Za-z0-9_-]{1,80}" maxlength="80" placeholder="例如 deepseek.config.toml 填写 deepseek" autocomplete="off"></div>
          <div id="endpoint-fields" class="connection-endpoint-fields">
            <div class="settings-field">
              <label for="connection-protocol">接口协议</label>
              <select id="connection-protocol"><option value="responses">Responses API</option><option value="chat_completions">Chat Completions</option></select>
            </div>
            <div class="settings-field">
              <label for="connection-base-url">API 主机</label>
              <input id="connection-base-url" type="url" placeholder="https://your-model-service.example/v1" autocomplete="off" aria-describedby="connection-endpoint-preview">
              <p id="connection-endpoint-preview" class="endpoint-preview" hidden></p>
            </div>
            <div id="stored-auth-field" class="settings-field" hidden>
              <label for="connection-api-key">API Key</label>
              <div class="api-key-actions">
                <div class="key-row">
                  <input id="connection-api-key" type="password" autocomplete="new-password" maxlength="8192" placeholder="输入此服务的 API Key">
                  <button id="show-api-key" class="icon-button api-key-toggle" type="button" aria-label="显示 API Key" title="显示 API Key" aria-controls="connection-api-key">
                    <svg aria-hidden="true"><use id="api-key-visibility-icon" href="#i-eye"/></svg>
                  </button>
                </div>
                <button id="check-api-service" type="button" class="secondary-button">检查</button>
              </div>
            </div>
            <div id="env-auth-field" class="settings-field" hidden><label for="connection-env-var">环境变量名称</label><input id="connection-env-var" placeholder="MY_MODEL_API_KEY" autocomplete="off"><details class="field-help"><summary>环境变量说明</summary><p>填写名称，勿填写密钥内容。环境变量需对本地服务进程可见。</p></details></div>
          </div>
        </div>
        <div class="settings-field"><div class="field-heading"><span class="model-list-label">模型</span><div class="model-list-actions">
          <button id="add-model" type="button" class="secondary-button model-list-action"><svg aria-hidden="true"><use href="#i-plus"/></svg>添加</button>
          <button id="discover-models" type="button" class="secondary-button model-list-action"><svg aria-hidden="true"><use href="#i-download"/></svg>获取模型列表</button>
        </div></div>
          <div class="model-table-scroll"><table class="model-table"><thead><tr><th scope="col">模型 ID</th><th scope="col">默认</th><th scope="col">操作</th></tr></thead><tbody id="model-rows"></tbody></table></div>
        </div>
        <div id="connection-test-result" class="connection-test-result" role="status" hidden></div>
        <div class="connection-form-actions"><details id="connection-more" class="connection-more" hidden><summary>更多</summary><div class="connection-more-actions"><button id="export-connection" type="button">导出为 profile</button><button id="remove-connection" type="button" class="remove-connection">移除连接</button></div></details><button id="test-connection" type="button" class="secondary-button" disabled>测试连接</button><button id="save-connection" type="submit" class="primary-button">保存连接</button></div><p id="connection-test-hint" class="settings-form-note">测试仅使用已保存的设置，可能计入服务用量。</p>
      </form></section></div>
    </div></section>
    <section class="conversation-scroll" id="conversation-scroll" aria-label="会话历史">
      <div class="welcome" id="welcome"><p>通过 Codex 调用子代理后，<br>从左侧打开会话查看消息与命令输出。</p></div>
      <div class="conversation" id="conversation" hidden><div class="conversation-heading"><div class="session-meta"><span class="model-chip" id="model-label"></span><span id="status-label" class="state-chip"></span></div></div><button id="load-earlier" class="load-earlier" hidden>加载更早的记录</button><div id="transcript" class="transcript"></div></div>
    </section>
    <button id="jump-bottom" class="jump-bottom icon-button" title="跳到最新记录" aria-label="跳到最新记录" hidden><svg><use href="#i-arrow"/></svg></button>
  </main>
</div>
<dialog id="rename-dialog" class="dialog"><form id="rename-form"><div class="dialog-title"><h2>重命名会话</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-x"/></svg></button></div><label for="rename-input">会话名称</label><input id="rename-input" maxlength="120" required autocomplete="off"><p class="dialog-hint">仅更新页面中的名称，原始会话记录保持原样。</p><div class="dialog-actions"><button type="button" class="secondary-button" data-close-dialog>取消</button><button type="submit" class="primary-button">保存名称</button></div></form></dialog>
<dialog id="info-dialog" class="dialog info-dialog"><div class="dialog-title"><h2>会话信息</h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg><use href="#i-x"/></svg></button></div><div id="info-content"></div></dialog>
<dialog id="model-dialog" class="dialog model-dialog" aria-labelledby="model-dialog-title">
  <div class="dialog-title">
    <h2 id="model-dialog-title">添加模型</h2>
    <button id="close-model-dialog" type="button" class="icon-button" aria-label="关闭"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <form id="model-dialog-form">
    <div class="settings-field"><label for="model-id-input">模型 ID</label><input id="model-id-input" required maxlength="200" autocomplete="off"></div>
    <div id="model-parameter-fields">
      <div class="connection-form-grid">
        <div class="settings-field"><label for="model-context-window">上下文窗口</label><input id="model-context-window" type="number" min="2048" max="4000000" placeholder="例如 128000"></div>
        <div class="settings-field"><label for="model-max-output">最大输出 Token 数</label><input id="model-max-output" type="number" min="1" max="4000000" placeholder="例如 4096"></div>
      </div>
      <div class="connection-form-grid">
        <div class="settings-field">
          <label for="model-effort-set">思考档位方案</label>
          <select id="model-effort-set">
            <option value="inherit">继承连接设置</option>
            <option value="provider">服务声明</option>
            <option value="openai">OpenAI 档位</option>
            <option value="deepseek">DeepSeek 档位</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div id="model-effort-field" class="settings-field" hidden>
          <label for="model-reasoning">思考强度</label>
          <select id="model-reasoning"><option value="">服务默认</option></select>
        </div>
        <div id="model-custom-effort-field" class="settings-field" hidden>
          <label for="model-custom-effort">思考强度</label>
          <input id="model-custom-effort" maxlength="64" autocomplete="off" placeholder="填写服务支持的值">
        </div>
      </div>
      <p id="model-effort-hint" class="settings-form-note" hidden></p>
    </div>
    <p id="model-dialog-result" class="connection-test-result" role="status" hidden></p>
    <div class="dialog-actions">
      <button id="cancel-model-dialog" type="button" class="secondary-button">取消</button>
      <button id="test-model-draft" type="button" class="secondary-button" title="使用当前填写的参数发送一次推理请求，可能计入服务用量">测试模型</button>
      <button id="save-model-draft" type="submit" class="primary-button">保存</button>
    </div>
  </form>
</dialog>
<dialog id="delete-connection-dialog" class="dialog"><div class="dialog-title"><h2>移除模型连接</h2></div><p class="delete-connection-note">移除此连接及其保存的凭据。已保存的会话记录仍可查看，使用此连接的后续任务需要重新配置。</p><div class="dialog-actions"><button type="button" class="secondary-button" data-close-dialog>取消</button><button id="confirm-remove-connection" type="button" class="primary-button">移除连接</button></div></dialog>
<dialog id="export-profile-dialog" class="dialog export-profile-dialog"><div class="dialog-title"><h2>导出已保存的连接</h2><button type="button" class="secondary-button" data-close-dialog>关闭</button></div><p id="export-profile-note" class="delete-connection-note"></p><p>配置文件保存位置</p><code id="export-profile-target"></code><pre id="export-profile-content"></pre><p>保存文件后，在终端运行</p><pre id="export-profile-launch"></pre><div class="dialog-actions"><button type="button" id="download-profile" class="primary-button">下载 profile 文件</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
